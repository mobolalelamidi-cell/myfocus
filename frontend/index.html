<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MyFocus - Connexion</title>
  <link rel="stylesheet" href="css/style.css">
  <script defer src="https://unpkg.com/lucide@latest"></script>
  <script defer src="js/config.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-visual" aria-label="MyFocus">
      <div class="brand-lockup">
        <div>
          <span class="eyebrow">Productivité quotidienne</span>
          <h1>MyFocus</h1>
        </div>
      </div>
      <div class="focus-preview">
        <div class="preview-top">
          <span>Aujourd’hui</span>
          <strong>72%</strong>
        </div>
        <div class="preview-bars">
          <span></span>
          <span></span>
          <span></span>
        </div>
        <div class="preview-note">
          <span class="note-dot"></span>
          <p>Planifier. Exécuter. Se souvenir.</p>
        </div>
      </div>
    </section>

    <section class="auth-panel">
      <div class="auth-card">
        <div class="auth-card-header">
          <div class="mini-logo">M</div>
          <div>
            <h2>Bienvenue</h2>
            <p>Connecte-toi à ton espace MyFocus.</p>
          </div>
        </div>

        <div class="auth-tabs" role="tablist" aria-label="Authentification">
          <button class="auth-tab is-active" id="loginTab" type="button" role="tab" aria-selected="true" aria-controls="loginForm" data-auth-tab="login">Connexion</button>
          <button class="auth-tab" id="registerTab" type="button" role="tab" aria-selected="false" aria-controls="registerForm" tabindex="-1" data-auth-tab="register">Inscription</button>
        </div>

        <form class="auth-form is-active" id="loginForm" role="tabpanel" aria-labelledby="loginTab">
          <label for="loginPhone">Téléphone</label>
          <input id="loginPhone" name="phone" type="tel" autocomplete="tel" placeholder="+229 00 00 00 00" required>

          <label for="loginPassword">Mot de passe</label>
          <input id="loginPassword" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required>

          <button class="primary-button full-button" type="submit">
            <i data-lucide="log-in" aria-hidden="true"></i>
            Se connecter
          </button>
        </form>

        <form class="auth-form" id="registerForm" role="tabpanel" aria-labelledby="registerTab">
          <label for="registerName">Nom</label>
          <input id="registerName" name="name" type="text" autocomplete="name" placeholder="Ton nom">

          <label for="registerPhone">Téléphone</label>
          <input id="registerPhone" name="phone" type="tel" autocomplete="tel" placeholder="+229 00 00 00 00" required>

          <label for="registerPassword">Mot de passe</label>
          <input id="registerPassword" name="password" type="password" autocomplete="new-password" minlength="6" placeholder="6 caractères minimum" required>

          <button class="primary-button full-button" type="submit">
            <i data-lucide="user-plus" aria-hidden="true"></i>
            Créer mon compte
          </button>
        </form>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
